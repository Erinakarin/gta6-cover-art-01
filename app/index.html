<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Drive — GTA-style Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Sunset Drive</h1>
    <p class="tagline">Your photo, a caption, and a neon sunset — made into cover art to share.</p>
    <label>Poster size
      <select id="size">
        <option value="1080x1080" selected>Square — 1080 x 1080</option>
        <option value="1080x1350">Portrait — 1080 x 1350</option>
        <option value="1920x1080">Wide — 1920 x 1080</option>
      </select>
    </label>
    <label>Photo for the selected panel
      <input id="photo" type="file" accept="image/*">
    </label>
    <button id="fill-all" type="button">Fill all panels with one photo</button>
    <label>Caption
      <input id="caption" type="text" maxlength="40" value="Sunset Heist">
    </label>
    <label>Zoom the selected panel
      <input id="zoom" type="range" min="50" max="400" value="100">
    </label>
    <p id="panel-label" class="hint">Panel 1 of 4</p>
    <p class="hint">Click a panel to select it. Drag inside a panel to move its photo; scroll over a panel to zoom it.</p>
    <button id="export" type="button" class="primary">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
